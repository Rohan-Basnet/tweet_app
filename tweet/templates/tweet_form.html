{% extends "base.html" %}

{% block title %}
 Tweet app

{% endblock %}

{% block content %}
 {% comment %} <h1 class="text-center mt-5">It is a tweet app.</h1> {% endcomment %}

<h2> {% if form.instance.pk  %} 
    Edit tweet 
    {% else %}
    Create tweet
    {% endif %}
 </h2>  
    <form method="POST" enctype="multipart/form-data" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Submit</button>
    </form>
    <a class="btn btn-success mt-4" href="{% url 'tweet_list' %}">Back to tweet list</a>


{% endblock %}
